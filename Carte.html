<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte Telecom</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    #panel {
        position: absolute;
        top: 20px;
        left: 20px;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
        z-index: 10;
    }
</style>
</head>
<body>

<div id="panel">
    <h3>Opérateurs</h3>
    <label><input type="checkbox" id="sfr" onchange="updateMarkers()"> SFR</label><br>
    <label><input type="checkbox" id="orange" onchange="updateMarkers()"> ORANGE</label><br>
    <label><input type="checkbox" id="free" onchange="updateMarkers()"> FREE</label><br>
</div>

<div id="map"></div>

<script>
let map;
let markers = [];

async function loadCSV() {
    const response = await fetch('sites.csv');
    const text = await response.text();

    return text
        .split('\n')
        .map(r => r.trim())
        .filter(r => r.length > 0)
        .slice(1)
        .map(row => {
            const parts = row.split(';').map(x => x.trim());
            return {
                code: parts[0],
                lat: parseFloat(parts[1]),
                lng: parseFloat(parts[2]),
                operateur: parts[3] ? parts[3].toUpperCase() : ""
            };
        });
}

async function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: -20.9, lng: 55.5 },
        zoom: 11
    });

    const data = await loadCSV();

    markers = data.map(item => {
        return {
            operateur: item.operateur,
            marker: new google.maps.Marker({
                position: { lat: item.lat, lng: item.lng },
                map: null,
                title: item.code
            })
        };
    });
}

function updateMarkers() {
    const showSFR = document.getElementById("sfr").checked;
    const showORANGE = document.getElementById("orange").checked;
    const showFREE = document.getElementById("free").checked;

    markers.forEach(obj => {
        const op = obj.operateur;

        const visible =
            (showSFR && op === "SFR") ||
            (showORANGE && op === "ORANGE") ||
            (showFREE && op === "FREE");

        obj.marker.setMap(visible ? map : null);
    });
}
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=TA_CLE_API&callback=initMap" async defer></script>

</body>
</html>
