<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MAPS TELECOM - Carte Telecom</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    #panel {
        position: absolute;
        top: 20px;
        left: 20px;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
        z-index: 1000;
    }

    .subfilters {
        margin-left: 15px;
        margin-top: 5px;
    }
</style>
</head>
<body>

<div id="panel">
    <h3>Opérateurs</h3>

    <label><input type="checkbox" id="sfr" onchange="updateMarkers()"> SFR</label><br>

    <label><input type="checkbox" id="orange" onchange="updateMarkers()"> ORANGE</label><br>
    <div class="subfilters">
        <label><input type="checkbox" id="orange_bno" onchange="updateMarkers()"> BNO</label><br>
        <label><input type="checkbox" id="orange_dni" onchange="updateMarkers()"> DNI</label><br>
        <label><input type="checkbox" id="orange_pau" onchange="updateMarkers()"> PAU</label><br>
        <label><input type="checkbox" id="orange_pir" onchange="updateMarkers()"> PIR</label><br>
        <label><input type="checkbox" id="orange_may" onchange="updateMarkers()"> MAY</label><br>
    </div>

    <label><input type="checkbox" id="free" onchange="updateMarkers()"> FREE</label><br>
    <label><input type="checkbox" id="zeop" onchange="updateMarkers()"> ZEOP</label><br>
    <label><input type="checkbox" id="tdf" onchange="updateMarkers()"> TDF</label><br>
    <label><input type="checkbox" id="freedom" onchange="updateMarkers()"> FREEDOM</label><br>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let map;
let markers = [];

async function loadCSV() {
    const response = await fetch('sites.csv');
    const text = await response.text();

    return text
        .split('\n')
        .map(r => r.trim())
        .filter(r => r.length > 0)
        .slice(1)
        .map(row => {
            const parts = row.split(';').map(x => x.trim());

            // Ignore lignes invalides
            if (parts.length < 4) return null;

            let operateur = parts[3].toUpperCase().trim();

            // Nettoyage opérateurs avec espaces
            operateur = operateur.replace(/\s+/g, "");

            let zone = parts[4] ? parts[4].toUpperCase().trim() : "";

            return {
                code: parts[0],
                lat: parseFloat(parts[1]),
                lng: parseFloat(parts[2]),
                operateur: operateur,
                zone: zone
            };
        })
        .filter(x => x !== null);
}

async function initMap() {
    map = L.map('map').setView([-20.9, 55.5], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const data = await loadCSV();

    markers = data.map(item => {
        const marker = L.marker([item.lat, item.lng], { title: item.code });
        marker.bindPopup(`<b>${item.code}</b><br>${item.operateur}<br>${item.zone}`);

        return {
            operateur: item.operateur,
            zone: item.zone,
            marker: marker
        };
    });

    updateMarkers();
}

function updateMarkers() {
    const showSFR = sfr.checked;
    const showORANGE = orange.checked;
    const showFREE = free.checked;
    const showZEOP = zeop.checked;
    const showTDF = tdf.checked;
    const showFREEDOM = freedom.checked;

    const o_bno = orange_bno.checked;
    const o_dni = orange_dni.checked;
    const o_pau = orange_pau.checked;
    const o_pir = orange_pir.checked;
    const o_may = orange_may.checked;

    markers.forEach(obj => {
        let visible = false;

        // ORANGE + zones
        if (obj.operateur === "ORANGE") {
            if (showORANGE) {
                visible =
                    (o_bno && obj.zone === "BNO") ||
                    (o_dni && obj.zone === "DNI") ||
                    (o_pau && obj.zone === "PAU") ||
                    (o_pir && obj.zone === "PIR") ||
                    (o_may && obj.zone === "MAY");
            }
        }

        // Autres opérateurs (sans zones)
        else {
            visible =
                (showSFR && obj.operateur === "SFR") ||
                (showFREE && obj.operateur === "FREE") ||
                (showZEOP && obj.operateur === "ZEOP") ||
                (showTDF && obj.operateur === "TDF") ||
                (showFREEDOM && obj.operateur === "FREEDOM");
        }

        if (visible) {
            if (!map.hasLayer(obj.marker)) obj.marker.addTo(map);
        } else {
            if (map.hasLayer(obj.marker)) map.removeLayer(obj.marker);
        }
    });
}

initMap();
</script>

</body>
</html>
