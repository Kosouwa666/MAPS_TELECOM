<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte Telecom</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: Arial;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    #panel {
        position: absolute;
        top: 20px;
        left: 20px;
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
        z-index: 1000;
    }
</style>
</head>
<body>

<div id="panel">
    <h3>Opérateurs</h3>

    <label><input type="checkbox" id="sfr" onchange="updateMarkers()"> SFR</label><br>
    <label><input type="checkbox" id="orange" onchange="updateMarkers()"> ORANGE</label><br>
    <label><input type="checkbox" id="free" onchange="updateMarkers()"> FREE</label><br>
    <label><input type="checkbox" id="zeop" onchange="updateMarkers()"> ZEOP</label><br>
    <label><input type="checkbox" id="tdf" onchange="updateMarkers()"> TDF</label><br>
    <label><input type="checkbox" id="freedom" onchange="updateMarkers()"> FREEDOM</label><br>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let map;
let markers = [];

async function loadCSV() {
    const response = await fetch('sites.csv');
    const text = await response.text();

    return text
        .split('\n')
        .map(r => r.trim())
        .filter(r => r.length > 0)
        .slice(1)
        .map(row => {
            const parts = row.split(';').map(x => x.trim());
            return {
                code: parts[0],
                lat: parseFloat(parts[1]),
                lng: parseFloat(parts[2]),
                operateur: parts[3] ? parts[3].toUpperCase() : ""
            };
        });
}

async function initMap() {
    map = L.map('map').setView([-20.9, 55.5], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const data = await loadCSV();

    markers = data.map(item => {
        const marker = L.marker([item.lat, item.lng], {
            title: item.code
        });

        marker.bindPopup(`<b>${item.code}</b><br>${item.operateur}`);

        return {
            operateur: item.operateur,
            marker: marker
        };
    });

    updateMarkers();
}

function updateMarkers() {
    const showSFR = document.getElementById("sfr").checked;
    const showORANGE = document.getElementById("orange").checked;
    const showFREE = document.getElementById("free").checked;
    const showZEOP = document.getElementById("zeop").checked;
    const showTDF = document.getElementById("tdf").checked;
    const showFREEDOM = document.getElementById("freedom").checked;

    markers.forEach(obj => {
        const op = obj.operateur;

        const visible =
            (showSFR && op === "SFR") ||
            (showORANGE && op === "ORANGE") ||
            (showFREE && op === "FREE") ||
            (showZEOP && op === "ZEOP") ||
            (showTDF && op === "TDF") ||
            (showFREEDOM && op === "FREEDOM");

        if (visible) {
            if (!map.hasLayer(obj.marker)) {
                obj.marker.addTo(map);
            }
        } else {
            if (map.hasLayer(obj.marker)) {
                map.removeLayer(obj.marker);
            }
        }
    });
}

initMap();
</script>

</body>
</html>
