<script>
// Empêche Enter de lancer Maps
document.getElementById("search").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        searchSite();
    }
});

let cachedData = null;

// Lecture du CSV (robuste)
// Format attendu : code;lat;lng  (le nom du site peut être inclus directement dans "code")
async function loadCSV() {
    if (cachedData) return cachedData;

    const response = await fetch('sites.csv');
    const text = await response.text();

    cachedData = text
        .split('\n')
        .map(r => r.trim())
        .filter(r => r.length > 0)
        .slice(1)
        .map(row => {
            const parts = row.split(';').map(x => x.trim());
            const code = parts[0] || '';
            const lat = parts[1] || '';
            const lng = parts[2] || '';
            return {
                code,
                lat,
                lng,
                // Version en majuscules du code, utilisée pour une recherche insensible à la casse
                searchText: code.toUpperCase()
            };
        });

    return cachedData;
}
